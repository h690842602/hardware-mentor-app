name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5
    
    - name: Fix missing Android resources
      run: |
        echo "=== Before fix ==="
        cat app/src/main/AndroidManifest.xml
        
        # 1. 修复 AndroidManifest.xml
        sed -i 's|android:theme="[^"]*"|android:theme="@style/AppTheme"|g' app/src/main/AndroidManifest.xml
        sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|g' app/src/main/AndroidManifest.xml
        
        # 2. 创建 styles.xml（parent 用 android:Theme，最基本、一定存在）
        mkdir -p app/src/main/res/values
        cat > app/src/main/res/values/styles.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="android:Theme">
            </style>
        </resources>
        EOF
        
        # 3. 创建占位图标（修复了 pathData 的 = 号）
        mkdir -p app/src/main/res/drawable
        cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="48dp"
            android:height="48dp"
            android:viewportWidth="24"
            android:viewportHeight="24">
            <path
                android:fillColor="#1976D2"
                android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13,17h-2v-6h2v6zM13,9h-2V7h2v2z"/>
        </vector>
        EOF
        
        echo "=== After fix ==="
        cat app/src/main/AndroidManifest.xml
    
    - name: Clean build
      run: gradle clean
    
    - name: Build Debug APK with Gradle
      run: gradle assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hardware-mentor-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30



