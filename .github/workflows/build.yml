name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5

    - name: Fix Android project files
      run: |
        echo "=== 开始一次性修复所有问题 ==="

        # 1. 修复 AndroidManifest.xml
        sed -i 's|android:theme="[^"]*"|android:theme="@style/AppTheme"|g' app/src/main/AndroidManifest.xml
        sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|g' app/src/main/AndroidManifest.xml
        echo "[OK] AndroidManifest.xml 已修复"

        # 2. 创建 styles.xml（base64 解码，避免 YAML heredoc 缩进问题）
        mkdir -p app/src/main/res/values
        echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHlsZSBuYW1lPSJBcHBUaGVtZSIgcGFyZW50PSJhbmRyb2lkOlRoZW1lIj4KICAgIDwvc3R5bGU+CjwvcmVzb3VyY2VzPg==' | base64 -d > app/src/main/res/values/styles.xml
        echo "[OK] styles.xml 已创建"

        # 3. 创建 drawable 矢量图标
        mkdir -p app/src/main/res/drawable
        echo '' | base64 -d > app/src/main/res/drawable/ic_launcher.xml
        echo "[OK] ic_launcher.xml 已创建"

        # 4. 创建布局文件 activity_main.xml
        mkdir -p app/src/main/res/layout
        echo '' | base64 -d > app/src/main/res/layout/activity_main.xml
        echo "[OK] activity_main.xml 已创建"

        # 5. 重写 MainActivity.java（核心修复：改用原生 Activity，摆脱 AppCompat 依赖）
        mkdir -p app/src/main/java/com/hardware/mentor
        echo '' | base64 -d > app/src/main/java/com/hardware/mentor/MainActivity.java
        echo "[OK] MainActivity.java 已重写（使用原生 Activity）"

        echo ""
        echo "=== 修复后的关键文件 ==="
        echo "--- AndroidManifest.xml ---"
        cat app/src/main/AndroidManifest.xml
        echo ""
        echo "--- MainActivity.java ---"
        cat app/src/main/java/com/hardware/mentor/MainActivity.java

    - name: Clean build
      run: gradle clean

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hardware-mentor-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
